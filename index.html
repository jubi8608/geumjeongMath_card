<meta property="og:title" content="금정수학교습소 | 학원 안내">
<meta property="og:description" content="과천 갈현동 · 초3~중3 학생별 개별 맞춤 수학 수업">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --navy:#0f2a4a; --navy-2:#1a3d66; --yellow:#f5c242; --yellow-2:#f0b72a;
    --blue:#2f7fd0; --bg:#f5f3ee; --card:#ffffff; --text:#1c2733; --muted:#6b7580; --line:#e4e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;
       align-items:center;padding:28px 16px 24px;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:380px}
  .topbar{height:6px;border-radius:6px;background:var(--yellow);margin-bottom:22px}
  .card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(15,42,74,.10)}
  .head{padding:26px 24px 20px;border-bottom:1px solid var(--line)}
  .head img{width:190px;height:auto;display:block}
  .label{margin-top:18px;font-size:13px;font-weight:700;color:var(--blue)}
  .name{margin-top:4px;font-size:25px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
  .body{padding:20px 22px 22px}
  .intro{font-size:15px;line-height:1.65;color:var(--text);margin-bottom:18px}
  .intro b{color:var(--navy)}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
       border-radius:13px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;
       border:1px solid transparent;transition:transform .08s,filter .15s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn svg{width:17px;height:17px;flex-shrink:0}
  .big{height:54px;font-size:16px}
  .mid{height:46px}
  .yellow{background:var(--yellow);color:var(--navy);box-shadow:0 4px 12px rgba(245,194,66,.35)}
  .yellow:hover{filter:brightness(.97)}
  .navy{background:var(--navy);color:#fff}
  .navy:hover{background:var(--navy-2)}
  .ghost{background:#fff;color:var(--navy);border-color:var(--line)}
  .ghost:hover{background:#f8f9fb}
  .stack{display:flex;flex-direction:column;gap:9px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .info{margin-top:18px;padding:15px 16px;background:#f7f8fa;border-radius:13px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .info .line{display:flex;gap:8px}
  .info .line + .line{margin-top:6px}
  .info .k{flex-shrink:0;font-weight:700;color:var(--navy);width:34px}
  .info a{color:var(--text);text-decoration:none;font-weight:600}
  .note{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.55}
  .foot{margin-top:18px;text-align:center;font-size:12px;color:#9aa1a8}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
         background:var(--navy);color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;
         opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
